name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version and write release notes from CHANGELOG
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $pkg = (Select-String -Path src/safe_workspace_mcp/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$version" -or $pkg -ne $version) { throw "tag $tag, pyproject $version and __version__ $pkg must agree" }

          $changelog = (Get-Content -Raw CHANGELOG.md) -replace "`r`n", "`n"
          $heads = [regex]::Matches($changelog, '(?m)^## \[([^\]]+)\][^\n]*$')
          $i = 0; while ($i -lt $heads.Count -and $heads[$i].Groups[1].Value -ne $version) { $i++ }
          if ($i -ge $heads.Count) { throw "CHANGELOG.md has no section for [$version]" }
          $start = $heads[$i].Index + $heads[$i].Length
          $end = if ($i + 1 -lt $heads.Count) { $heads[$i + 1].Index } else { $changelog.Length }
          $body = $changelog.Substring($start, $end - $start).Trim()
          if (-not $body) { throw "CHANGELOG.md section for [$version] is empty" }

          $launcher = Get-Content -Raw Start-SafeWorkspaceMCP.ps1
          $tunnel = [regex]::Match($launcher, '(?m)^\$TunnelClientVersion = ''([^'']+)''').Groups[1].Value
          $sums = [regex]::Matches($launcher, '''(AMD64|ARM64)''\s*=\s*@\{[^}]*?SHA256\s*=\s*''([0-9A-Fa-f]{64})''') |
            ForEach-Object { "  - $($_.Groups[1].Value): ``$($_.Groups[2].Value.ToLowerInvariant())``" }

          $notes = @($body, '', '### Portable release',
            "- On first run the launcher downloads ``tunnel-client`` $tunnel and verifies its SHA-256:") + $sums + @(
            '- Verify the ZIP against `SHA256SUMS.txt`; exact bundled package versions are in `BUILD-ENVIRONMENT.txt` inside the ZIP.')
          if ($i + 1 -lt $heads.Count) {
            $notes += @('', "**Full Changelog**: https://github.com/${{ github.repository }}/compare/v$($heads[$i + 1].Groups[1].Value)...$tag")
          }
          $notes -join "`n" | Set-Content -Path release-notes.md -Encoding utf8

      - name: Install project + tools (exact runtime pins)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest anyio ruff mypy
          pip install "mcp==2.0.0" "dulwich==1.2.6" "pyinstaller==6.22.1"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test (source)
        shell: bash
        run: pytest tests -q

      - name: Build portable release
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "build-venv"
          python -m venv $venv
          & (Join-Path $venv "Scripts\python.exe") -m pip install --quiet --upgrade pip
          & (Join-Path $venv "Scripts\python.exe") -m pip install --quiet . "mcp==2.0.0" "dulwich==1.2.6" "pyinstaller==6.22.1"
          powershell -File packaging\build-portable.ps1 -Version "${{ github.ref_name }}".Substring(1) -BuildVenv $venv

      - name: Packaged runtime integration test
        shell: pwsh
        env:
          SAFE_MCP_PACKAGED_EXE: ${{ github.workspace }}\dist\_pyi_dist\safe-workspace-mcp\safe-workspace-mcp.exe
        run: pytest tests/test_packaged_runtime.py tests/test_launcher.py -q

      - name: Create GitHub release with artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag "dist/safe-workspace-mcp-$($tag.Substring(1))-windows-x64.zip" dist/SHA256SUMS.txt --title $tag --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
