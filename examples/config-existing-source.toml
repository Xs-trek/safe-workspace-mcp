# Import an existing plain source directory (no .git inside!)
# First start creates the initial snapshot; after that it is managed.
[workspace]
root = "D:/code/my-project"
max_file_bytes = 2097152
max_read_bytes = 1048576
max_transaction_bytes = 10485760
max_search_results = 200
excluded = ["node_modules", "build", "dist", ".venv", "target", "vendor"]

[paths]
reject_reparse_points = true
reject_hardlinks = true
require_same_filesystem = true

[write]
require_expected_hash = true

[git]
mode = "managed"
author_name = "Safe Workspace MCP"
author_email = "safe-workspace-mcp@local"

[search]
include_hidden = false

[server]
transport = "stdio"
