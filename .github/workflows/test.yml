name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest anyio ruff mypy
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Test
        shell: bash
        run: |
          set +e
          pytest tests -v --tb=short -ra 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E 'FAILED|ERROR' pytest.log | tail -n 20 | tr '\n' ';')
            echo "::error title=pytest failure::$summary"
            exit "$status"
          fi
